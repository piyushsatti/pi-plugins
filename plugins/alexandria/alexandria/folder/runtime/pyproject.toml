[project]
name = "rag"
version = "0.2.1"
description = "MCP server for per-project document retrieval."
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.1,<3",
    "lancedb>=0.38",
    "model2vec>=0.9",
    "numpy>=2.0",
    "pyarrow>=17",
]

[project.scripts]
rag = "rag.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
