[project]
name = "memory"
version = "0.1.2"
description = "MCP server over the markdown memory store."
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.1,<3",
    "pyyaml>=6.0",
]

[project.scripts]
memory = "memory.__main__:main"
memory-admin = "memory.admin:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
